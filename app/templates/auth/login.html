{% extends "base.html" %}
{% block title %}{{ t('login') }} — BilimAI{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="glass auth-card">
    <div class="auth-mascot">
      <div class="mascot-avatar">🌸</div>
    </div>
    <h1 class="auth-title">{{ t('app_name') }}</h1>
    <p class="auth-sub">{{ t('tagline') }}</p>

    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}

    <form method="post" action="/auth/login" class="form">
      <label>{{ t('email') }} / {{ t('username') }}</label>
      <input type="text" name="login_id" required autocomplete="username" />
      <label>{{ t('password') }}</label>
      <input type="password" name="password" required autocomplete="current-password" />
      <button class="btn primary full">{{ t('login') }}</button>
    </form>

    <div class="auth-footer">
      <a href="/auth/register?lang={{ lang }}">{{ t('register') }}</a>
      <div class="lang-switch">
        <a class="lang {% if lang=='uz' %}active{% endif %}" href="?lang=uz">UZ</a>
        <a class="lang {% if lang=='ru' %}active{% endif %}" href="?lang=ru">RU</a>
        <a class="lang {% if lang=='en' %}active{% endif %}" href="?lang=en">EN</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
