services:
  - type: web
    name: bilimai
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python -c "from app.database import init_db; init_db()"
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bilimai-db
          property: connectionString
      - key: AI_PROVIDER
        value: groq
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-120b
      - key: AI_TIMEOUT
        value: "60"
      - key: SESSION_COOKIE_NAME
        value: bilimai_session
      - key: SESSION_MAX_AGE
        value: "604800"
      - key: BCRYPT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      # Quyidagilarni Render dashboard'da qo'lda kiritasiz:
      - key: AI_API_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false

databases:
  - name: bilimai-db
    databaseName: bilimai
    user: bilimai
    plan: free
